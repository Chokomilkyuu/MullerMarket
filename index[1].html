<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muller Market — Liceo Fresia Graciela Müller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============ TOKENS ============ */
  :root{
    --navy:#2E4E75;
    --navy-deep:#1E3654;
    --burgundy:#7A2340;
    --burgundy-deep:#5C1A30;
    --gold:#C6A15B;
    --gold-deep:#A3803F;
    --paper:#F3F4F8;
    --card:#FFFFFF;
    --ink:#171A24;
    --muted:#5B6072;
    --line:#E2E4EC;
    --danger:#A3392F;
    --radius-s:8px;
    --radius-m:14px;
    --radius-l:20px;
    --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body:'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --shadow-card: 0 1px 2px rgba(18,33,61,.06);
    --shadow-pop: 0 16px 40px rgba(11,24,48,.28);
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root[data-theme="dark"],
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark){
      --paper:#0B1220;
      --card:#121B30;
      --ink:#EEF0F6;
      --muted:#A2A8BC;
      --line:#253049;
      --shadow-card: 0 1px 2px rgba(0,0,0,.35);
      --shadow-pop: 0 20px 48px rgba(0,0,0,.55);
      --gold:#D8B876;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0B1220;
    --card:#121B30;
    --ink:#EEF0F6;
    --muted:#A2A8BC;
    --line:#253049;
    --shadow-card: 0 1px 2px rgba(0,0,0,.35);
    --shadow-pop: 0 20px 48px rgba(0,0,0,.55);
    --gold:#D8B876;
  }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    padding-bottom: calc(28px + env(safe-area-inset-bottom,0px));
  }
  body.modal-open{ overflow:hidden; }
  img,svg{ max-width:100%; display:block; }
  button{ font-family:inherit; }
  a{ color:inherit; }
  ::selection{ background:var(--gold); color:var(--navy-deep); }
  :focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }

  /* ============ HEADER ============ */
  header.top{
    position:sticky; top:0; z-index:30;
    background:linear-gradient(to top right, #5E2D40 0%, var(--navy) 100%);
    padding: calc(12px + env(safe-area-inset-top,0px)) 16px 12px;
    box-shadow: 0 1px 0 rgba(198,161,91,.35);
  }
  .top-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    min-width:0;
    animation: brand-in .6s ease-out;
  }
  @keyframes brand-in{
    from{ opacity:0; transform:translateY(-6px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .brand-logo{
    flex:none; height:44px; width:auto; object-fit:contain;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.4));
  }
  .brand-text{ min-width:0; }
  .brand-text h1{
    margin:0; font-family:var(--font-display); font-weight:600;
    font-size:1.28rem; color:#fff; letter-spacing:.01em; line-height:1.1;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .brand-text p{
    margin:2px 0 0; font-size:.72rem; color:#C9CEDD;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .top-actions{ display:flex; align-items:center; gap:8px; flex:none; }
  .icon-btn{
    width:40px; height:40px; border-radius:50%; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size:1.05rem; transition:transform .15s ease;
  }
  .icon-btn:active{ transform:scale(.92); }
  .icon-btn.publish{
    background:var(--gold); color:var(--navy-deep); font-weight:700;
  }
  .icon-btn.profile{
    background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.28);
    font-family:var(--font-display); font-weight:600; font-size:.85rem;
  }

  /* ============ NAV ============ */
  nav.tabs{
    position:sticky; top: calc(72px + env(safe-area-inset-top,0px)); z-index:29;
    background:var(--paper);
    display:flex; gap:4px; padding:8px 12px; border-bottom:1px solid var(--line);
  }
  .tab{
    flex:1; border:none; background:transparent; cursor:pointer;
    padding:9px 6px; border-radius:var(--radius-s);
    font-size:.82rem; font-weight:600; color:var(--muted);
    display:flex; flex-direction:column; align-items:center; gap:2px;
    position:relative;
  }
  .tab-icon{
    width:20px; height:20px; display:inline-block; background-color:currentColor;
    -webkit-mask-size:contain; mask-size:contain;
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    -webkit-mask-position:center; mask-position:center;
  }

  .tab.active{ color:var(--burgundy); background:rgba(122,35,64,.07); }
  .tab .badge{
    position:absolute; top:2px; right:14%;
    background:var(--burgundy); color:#fff; font-size:.62rem; font-weight:700;
    min-width:16px; height:16px; border-radius:8px; padding:0 4px;
    display:flex; align-items:center; justify-content:center;
  }

  /* ============ PANELS (categorías / buscar) ============ */
  .subpanel{
    background:var(--card); border-bottom:1px solid var(--line);
    padding:12px 14px; animation: panel-in .18s ease-out;
  }
  @keyframes panel-in{ from{ opacity:0; transform:translateY(-4px);} to{opacity:1; transform:translateY(0);} }
  .cat-grid{ display:flex; flex-wrap:wrap; gap:8px; }
  .cat-pill{
    border:1px solid var(--line); background:var(--paper); color:var(--ink);
    padding:8px 12px; border-radius:999px; font-size:.82rem; cursor:pointer;
    display:flex; align-items:center; gap:6px; font-weight:500;
  }
  .cat-pill.active{ background:var(--navy); border-color:var(--navy); color:#fff; }
  .search-row{ display:flex; gap:8px; }
  .search-row input{
    flex:1; border:1px solid var(--line); border-radius:var(--radius-s);
    padding:10px 12px; font-size:.9rem; background:var(--paper); color:var(--ink);
  }
  .search-row input:focus{ border-color:var(--gold); }
  .clear-btn{
    border:none; background:var(--line); color:var(--muted); border-radius:var(--radius-s);
    padding:0 14px; font-size:.82rem; cursor:pointer; font-weight:600;
  }

  .filter-chip{
    margin:10px 14px 0; display:inline-flex; align-items:center; gap:6px;
    background:var(--card); border:1px solid var(--gold); color:var(--burgundy);
    padding:6px 10px 6px 12px; border-radius:999px; font-size:.8rem; font-weight:600;
  }
  .filter-chip button{ border:none; background:none; cursor:pointer; color:var(--burgundy); font-size:.9rem; line-height:1; }

  /* ============ GRID / CARDS ============ */
  main{ padding:14px; }
  .section-label{
    font-family:var(--font-display); font-size:1.05rem; font-weight:600;
    margin:2px 0 12px; color:var(--ink);
  }
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
    gap:14px;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius-m);
    overflow:hidden; cursor:pointer; text-align:left; padding:0;
    display:flex; flex-direction:column;
    transition:box-shadow .15s ease, transform .15s ease;
  }
  .card:hover, .card:focus-visible{ box-shadow:var(--shadow-pop); transform:translateY(-2px); }
  .card-media{
    position:relative; aspect-ratio:1/1; background:var(--paper);
    display:flex; align-items:center; justify-content:center;
    border-bottom:1px solid var(--line); background-size:cover; background-position:center;
  }
  .card-media .emoji{ font-size:2.4rem; opacity:.55; }
  .price-badge{
    position:absolute; left:8px; bottom:8px;
    background:var(--gold); color:var(--navy-deep); font-weight:700; font-size:.85rem;
    padding:4px 9px; border-radius:var(--radius-s); box-shadow:var(--shadow-card);
  }
  .card-body{ padding:10px 11px 12px; }
  .card-title{
    font-family:var(--font-display); font-weight:600; font-size:.92rem; margin:0 0 4px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    line-height:1.28;
  }
  .card-meta{ font-size:.74rem; color:var(--muted); margin:0; }

  .empty-state{
    text-align:center; padding:48px 20px; color:var(--muted);
  }
  .empty-state .e-emoji{ font-size:2rem; margin-bottom:8px; }
  .empty-state p{ margin:4px 0 0; font-size:.88rem; max-width:280px; margin-inline:auto; }

  /* ============ OVERLAY / MODALS ============ */
  .overlay{
    position:fixed; inset:0; background:rgba(11,24,48,.55);
    display:none; align-items:flex-end; justify-content:center; z-index:50;
    padding: 0;
  }
  .overlay.open{ display:flex; }
  .sheet{
    background:var(--card); width:100%; max-width:480px;
    border-radius:var(--radius-l) var(--radius-l) 0 0;
    max-height:88vh; overflow-y:auto;
    padding: 16px 18px calc(20px + env(safe-area-inset-bottom,0px));
    animation: sheet-in .22s ease-out;
    box-shadow: var(--shadow-pop);
  }
  @keyframes sheet-in{ from{ transform:translateY(24px); opacity:.6; } to{ transform:translateY(0); opacity:1; } }
  .sheet-head{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;
    position:sticky; top:0; background:var(--card); padding-top:2px;
  }
  .sheet-head h2{ font-family:var(--font-display); font-size:1.15rem; margin:0; font-weight:600; }
  .sheet-close{
    border:none; background:var(--line); width:32px; height:32px; border-radius:50%;
    cursor:pointer; font-size:1rem; color:var(--ink); flex:none;
  }

  .field{ margin-bottom:13px; }
  .field label{ display:block; font-size:.8rem; font-weight:600; margin-bottom:5px; color:var(--ink); }
  .field input, .field select, .field textarea{
    width:100%; border:1px solid var(--line); border-radius:var(--radius-s);
    padding:10px 11px; font-size:.9rem; background:var(--paper); color:var(--ink);
    font-family:inherit;
  }
  .field textarea{ resize:vertical; min-height:70px; }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--gold); }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .hint{ font-size:.72rem; color:var(--muted); margin-top:4px; }

  .photo-upload{
    display:flex; align-items:center; gap:12px;
  }
  .photo-preview{
    width:64px; height:64px; border-radius:var(--radius-s); background:var(--paper);
    border:1px dashed var(--line); display:flex; align-items:center; justify-content:center;
    font-size:1.4rem; color:var(--muted); overflow:hidden; background-size:cover; background-position:center; flex:none;
  }
  .file-label{
    border:1px solid var(--line); border-radius:var(--radius-s); padding:9px 13px;
    font-size:.82rem; font-weight:600; cursor:pointer; color:var(--navy);
  }
  .file-label input{ display:none; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border:none; border-radius:var(--radius-s); padding:12px 16px;
    font-size:.9rem; font-weight:700; cursor:pointer; width:100%;
    transition:transform .12s ease;
  }
  .btn:active{ transform:scale(.98); }
  .btn-primary{ background:var(--burgundy); color:#fff; }
  .btn-gold{ background:var(--gold); color:var(--navy-deep); }
  .btn-ghost{ background:var(--paper); color:var(--ink); border:1px solid var(--line); }
  .btn-small{ width:auto; padding:8px 12px; font-size:.8rem; }

  /* Detail modal */
  .detail-media{
    width:100%; aspect-ratio:4/3; border-radius:var(--radius-m); background:var(--paper);
    display:flex; align-items:center; justify-content:center; margin-bottom:14px;
    background-size:cover; background-position:center; border:1px solid var(--line);
  }
  .detail-media .emoji{ font-size:3.4rem; opacity:.55; }
  .detail-price{ font-family:var(--font-display); font-size:1.5rem; font-weight:700; color:var(--burgundy); margin:0 0 4px; }
  .detail-title{ font-size:1.02rem; font-weight:600; margin:0 0 10px; }
  .detail-desc{ font-size:.88rem; color:var(--ink); line-height:1.5; margin:0 0 16px; }
  .seller-box{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-s);
    padding:12px; margin-bottom:16px; display:flex; gap:10px; align-items:center;
  }
  .seller-avatar{
    width:38px; height:38px; border-radius:50%; background:var(--navy); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.82rem; flex:none;
    font-family:var(--font-display);
  }
  .seller-box .s-name{ font-weight:600; font-size:.88rem; margin:0; }
  .seller-box .s-meta{ font-size:.76rem; color:var(--muted); margin:2px 0 0; }
  .detail-actions{ display:flex; gap:10px; }

  /* Cart */
  .cart-item{ display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); align-items:center; }
  .cart-item .ci-media{
    width:52px; height:52px; border-radius:var(--radius-s); background:var(--paper); flex:none;
    display:flex; align-items:center; justify-content:center; font-size:1.3rem; background-size:cover; background-position:center;
    border:1px solid var(--line);
  }
  .cart-item .ci-info{ flex:1; min-width:0; }
  .cart-item .ci-info p{ margin:0; }
  .ci-title{ font-size:.85rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ci-price{ font-size:.8rem; color:var(--burgundy); font-weight:700; margin-top:2px !important; }
  .ci-remove{ border:none; background:none; color:var(--muted); font-size:1.1rem; cursor:pointer; flex:none; padding:6px; }
  .cart-total{ display:flex; justify-content:space-between; align-items:center; padding:14px 0 6px; font-family:var(--font-display); font-size:1.05rem; font-weight:600; }

  /* Profile */
  .profile-head{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .profile-avatar{
    width:56px; height:56px; border-radius:50%; background:var(--navy); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:1.1rem;
    font-family:var(--font-display); flex:none;
  }
  .balance-box{
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 100%);
    border-radius:var(--radius-m); padding:16px; color:#fff; margin-bottom:18px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .balance-box .b-label{ font-size:.76rem; color:#C9CEDD; margin:0 0 3px; }
  .balance-box .b-amount{ font-family:var(--font-display); font-size:1.4rem; font-weight:700; margin:0; color:var(--gold); }

  .divider{ border:none; border-top:1px solid var(--line); margin:16px 0; }

  /* Toast */
  #toast{
    position:fixed; left:50%; bottom: calc(22px + env(safe-area-inset-bottom,0px));
    transform:translate(-50%, 12px); background:var(--navy-deep); color:#fff;
    padding:11px 18px; border-radius:999px; font-size:.85rem; font-weight:600;
    box-shadow:var(--shadow-pop); z-index:80; opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease; max-width:88vw; text-align:center;
  }
  #toast.show{ opacity:1; transform:translate(-50%, 0); }

  @media (min-width:640px){
    .grid{ grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); }
    .overlay{ align-items:center; }
    .sheet{ border-radius:var(--radius-l); max-height:84vh; }
  }
</style>
</head>

<!-- ============ OVERLAY (compartido) ============ -->
<div class="overlay" id="overlay">

  <!-- Detalle de producto -->
  <div class="sheet" id="sheetDetail" hidden>
    <div class="sheet-head">
      <h2>Detalle del producto</h2>
      <button class="sheet-close" data-close aria-label="Cerrar">✕</button>
    </div>
    <div id="detailContent"></div>
  </div>

  <!-- Publicar producto -->
  <div class="sheet" id="sheetPublish" hidden>
    <div class="sheet-head">
      <h2>Publicar producto</h2>
      <button class="sheet-close" data-close aria-label="Cerrar">✕</button>
    </div>
    <form id="publishForm">
      <div class="field">
        <label for="pFoto">Foto del producto</label>
        <div class="photo-upload">
          <div class="photo-preview" id="pFotoPreview">🖼️</div>
          <label class="file-label">Elegir foto
            <input type="file" id="pFoto" accept="image/*">
          </label>
        </div>
        <p class="hint">Opcional. Si no subes una foto, se mostrará un ícono según la categoría.</p>
      </div>
      <div class="field">
        <label for="pTitulo">Título</label>
        <input type="text" id="pTitulo" required maxlength="60" placeholder="Ej: Calculadora científica Casio">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="pPrecio">Precio (CLP)</label>
          <input type="number" id="pPrecio" required min="0" step="1" placeholder="5000">
        </div>
        <div class="field">
          <label for="pCategoria">Categoría</label>
          <select id="pCategoria" required></select>
        </div>
      </div>
      <div class="field">
        <label for="pDescripcion">Detalles del producto</label>
        <textarea id="pDescripcion" required maxlength="240" placeholder="Estado, características, motivo de venta..."></textarea>
      </div>
      <hr class="divider">
      <div class="field-row">
        <div class="field">
          <label for="pNombre">Tu nombre</label>
          <input type="text" id="pNombre" required maxlength="40" placeholder="Ej: Martina R.">
        </div>
        <div class="field">
          <label for="pCurso">Tu curso</label>
          <input type="text" id="pCurso" required maxlength="20" placeholder="Ej: 3° Medio A">
        </div>
      </div>
      <div class="field">
        <label for="pContacto">Contacto (WhatsApp, Instagram o correo)</label>
        <input type="text" id="pContacto" required maxlength="60" placeholder="Ej: WhatsApp +56 9 1234 5678">
      </div>
      <button type="submit" class="btn btn-primary">Publicar producto</button>
    </form>
  </div>

  <!-- Perfil -->
  <div class="sheet" id="sheetProfile" hidden>
    <div class="sheet-head">
      <h2>Mi perfil</h2>
      <button class="sheet-close" data-close aria-label="Cerrar">✕</button>
    </div>
    <div class="profile-head">
      <div class="profile-avatar" id="profileAvatarBig">--</div>
      <div>
        <p style="margin:0;font-weight:600;" id="profileHeadName">—</p>
        <p style="margin:2px 0 0;font-size:.8rem;color:var(--muted);" id="profileHeadCurso">—</p>
      </div>
    </div>
    <div class="balance-box">
      <div>
        <p class="b-label">Saldo disponible</p>
        <p class="b-amount" id="balanceAmount">$0</p>
      </div>
      <button class="btn btn-gold btn-small" id="btnAddBalance" type="button">+ Simular ingreso</button>
    </div>
    <form id="profileForm">
      <div class="field">
        <label for="prNombre">Nombre</label>
        <input type="text" id="prNombre" required maxlength="40">
      </div>
      <div class="field">
        <label for="prCurso">Curso</label>
        <input type="text" id="prCurso" required maxlength="20" placeholder="Ej: 2° Medio B">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="prCorreo">Correo</label>
          <input type="email" id="prCorreo" placeholder="tucorreo@liceo.cl">
        </div>
        <div class="field">
          <label for="prTelefono">Teléfono</label>
          <input type="tel" id="prTelefono" placeholder="+56 9 ....">
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Guardar cambios</button>
    </form>
  </div>

  <!-- Carrito -->

    </div>
    <div id="cartContent"></div>
  </div>

  ];

  function catInfo(id){
    for (var i=0;i<CATEGORIES.length;i++){ if (CATEGORIES[i].id===id) return CATEGORIES[i]; }
    return {id:id, label:'Otros', icon:'🎒'};
  }

  function seedProducts(){
    var now = Date.now();
    var day = 86400000;
    var raw = [
      ['Calculadora científica Casio fx-82','utiles',8000,'Calculadora científica en buen estado, ideal para Matemática y Física. Incluye funda.','Martina R.','3° Medio A','WhatsApp +56 9 1234 5678',2],
      ['Cuaderno universitario matemático, nuevo','utiles',2500,'Cuaderno de 100 hojas cuadriculado, sin usar, tapa dura azul marino.','Benjamín S.','1° Medio C','Instagram @benja.s',1],
      ['Apuntes completos de Historia, 3° medio','utiles',3000,'Resumen de todo el año, ordenado por unidad, con esquemas y mapas conceptuales.','Florencia T.','3° Medio B','Correo flor.t@gmail.com',4],
      ['Polerón oficial del liceo, talla M','ropa',12000,'Polerón institucional talla M, usado un semestre, sin manchas ni roturas.','Ignacio P.','4° Medio A','WhatsApp +56 9 8765 4321',6],
      ['Alfajores caseros, pack de 6','snacks',2000,'Alfajores caseros de maicena, horneados cada semana. Pedidos con un día de anticipación.','Camila V.','2° Medio B','WhatsApp +56 9 2345 6789',0],
      ['Set de 24 lápices de colores','utiles',5000,'Set completo, usado en pocas clases de Artes Visuales, buen estado.','Diego M.','1° Medio A','Instagram @diegom.art',3],
      ['Balón de fútbol N°5','otros',10000,'Balón oficial N°5, poco uso, ideal para los recreos o entrenamientos.','Tomás L.','4° Medio B','WhatsApp +56 9 3456 7890',5],
      ['Clases particulares de Matemática','tutorias',5000,'Apoyo en Matemática de 7° básico a 2° medio, por hora, online o presencial.','Valentina C.','4° Medio A','Correo vale.tutorias@gmail.com',1],
      ['Mochila JanSport semi-nueva','otros',15000,'Mochila resistente, buen estado general, varios compartimentos.','Sebastián R.','2° Medio A','WhatsApp +56 9 4567 8901',7],
      ['"Cien años de soledad", edición escolar','otros',4000,'Libro de lectura complementaria usado en el liceo, subrayado a lápiz.','Antonia G.','3° Medio C','Instagram @antog.reads',2]
    ];
    return raw.map(function(r, i){
      return {
        id: 'seed-' + (i+1),
        title:r[0], category:r[1], price:r[2], desc:r[3],
        seller:{ name:r[4], curso:r[5], contacto:r[6] },
        photo:null,
        createdAt: now - r[7]*day
      };
    });
  }

  var STORAGE_KEY = 'fgmMercadoData';

  function defaultState(){
    return {
      products: seedProducts(),
      cart: [],
      profile: { name:'Estudiante Fresia', curso:'Sin curso asignado', correo:'', telefono:'', saldo:10000 },
      catClicks: {}
    };
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) { var d = defaultState(); saveState(d); return d; }
      var parsed = JSON.parse(raw);
      if (!parsed.products || !parsed.products.length) parsed.products = seedProducts();
      if (!parsed.cart) parsed.cart = [];
      if (!parsed.profile) parsed.profile = defaultState().profile;
      if (!parsed.catClicks) parsed.catClicks = {};
      return parsed;
    }catch(e){
      console.error('No se pudo leer el almacenamiento local, se usan datos por defecto.', e);
      return defaultState();
    }
  }

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){
      console.error('No se pudo guardar en el almacenamiento local.', e);
      showToast('No se pudo guardar el cambio en este dispositivo');
    }
  }

  var state = loadState();

  /* ============ UTILIDADES ============ */
  function formatCLP(n){
    try{ return '$' + Number(n).toLocaleString('es-CL'); }
    catch(e){ return '$' + n; }
  }

  function relativeDate(ts){
    var diffMs = Date.now() - ts;
    var days = Math.floor(diffMs / 86400000);
    if (days <= 0) return 'Publicado hoy';
    if (days === 1) return 'Publicado ayer';
    return 'Publicado hace ' + days + ' días';
  }

  function initials(name){
    if (!name) return '--';
    var parts = name.trim().split(/\s+/);
    var a = parts[0] ? parts[0][0] : '';
    var b = parts[1] ? parts[1][0] : '';
    return (a+b).toUpperCase() || '--';
  }

  var toastTimer = null;
  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2400);
  }

  /* ============ ESTADO DE VISTA ============ */
  var view = { mode:'paraTi', category:null, query:'' };

  /* ============ RENDER: CABECERA / TABS ============ */
  function renderProfileButton(){
    document.getElementById('btnProfile').textContent = initials(state.profile.name);
  }

  function renderCartBadge(){
    var badge = document.getElementById('cartBadge');
    var n = state.cart.length;
    if (n > 0){ badge.hidden = false; badge.textContent = n; }
    else { badge.hidden = true; }
  }

  function setActiveTab(mode){
    var tabs = document.querySelectorAll('.tab');
    tabs.forEach(function(t){
      var active = t.getAttribute('data-view') === mode;
      t.classList.toggle('active', active);
      t.setAttribute('aria-selected', active ? 'true':'false');
    });
  }

  /* ============ CATEGORÍAS PANEL ============ */
  function renderCatPanel(){
    var wrap = document.getElementById('catGrid');
    var html = '<button class="cat-pill' + (view.category===null?' active':'') + '" data-cat="">Todas</button>';
    CATEGORIES.forEach(function(c){
      html += '<button class="cat-pill' + (view.category===c.id?' active':'') + '" data-cat="' + c.id + '">' + c.icon + ' ' + c.label + '</button>';
    });
    wrap.innerHTML = html;
    wrap.querySelectorAll('.cat-pill').forEach(function(btn){
      btn.addEventListener('click', function(){
        var cid = btn.getAttribute('data-cat');
        view.mode = 'categorias';
        view.category = cid || null;
        if (cid){ state.catClicks[cid] = (state.catClicks[cid]||0) + 1; saveState(); }
        renderAll();
      });
    });
  }

  /* ============ CHIP DE FILTRO ACTIVO ============ */
  function renderFilterChip(){
    var wrap = document.getElementById('filterChipWrap');
    if (view.mode === 'categorias' && view.category){
      var c = catInfo(view.category);
      wrap.innerHTML = '<span class="filter-chip">' + c.icon + ' ' + c.label + '<button id="chipClear" aria-label="Quitar filtro">✕</button></span>';
      document.getElementById('chipClear').addEventListener('click', function(){
        view.category = null; renderAll();
      });
    } else {
      wrap.innerHTML = '';
    }
  }

  /* ============ GRID DE PRODUCTOS ============ */
  function currentProducts(){
    var list = state.products.slice();

    if (view.mode === 'categorias' && view.category){
      list = list.filter(function(p){ return p.category === view.category; });
    }

    if (view.mode === 'buscar' && view.query.trim()){
      var q = view.query.trim().toLowerCase();
      list = list.filter(function(p){
        return (p.title + ' ' + p.desc + ' ' + catInfo(p.category).label).toLowerCase().indexOf(q) !== -1;
      });
    }

    if (view.mode === 'paraTi'){
      var clicks = state.catClicks;
      var hasClicks = Object.keys(clicks).length > 0;
      if (hasClicks){
        list.sort(function(a,b){
          var ca = clicks[a.category] || 0, cb = clicks[b.category] || 0;
          if (cb !== ca) return cb - ca;
          return b.createdAt - a.createdAt;
        });
      } else {
        list.sort(function(a,b){ return b.createdAt - a.createdAt; });
      }
    } else {
      list.sort(function(a,b){ return b.createdAt - a.createdAt; });
    }

    return list;
  }

  function gridLabelText(){
    if (view.mode === 'paraTi') return 'Para ti';
    if (view.mode === 'categorias') return view.category ? catInfo(view.category).label : 'Todas las categorías';
    if (view.mode === 'buscar') return view.query.trim() ? 'Resultados de «' + view.query.trim() + '»' : 'Buscar productos';
    if (view.mode === 'carrito') return 'Para ti';
    return 'Para ti';
  }

  function cardMediaHTML(p){
    if (p.photo){
      return '<div class="card-media" style="background-image:url(\'' + p.photo + '\')"></div>';
    }
    return '<div class="card-media"><span class="emoji">' + catInfo(p.category).icon + '</span></div>';
  }

  function renderGrid(){
    document.getElementById('gridLabel').textContent = gridLabelText();
    var grid = document.getElementById('grid');
    var list = currentProducts();

    if (view.mode === 'buscar' && !view.query.trim()){
      grid.innerHTML = '';
      grid.parentElement.querySelector('.empty-state')?.remove();
      var wrap = document.createElement('div');
      wrap.className = 'empty-state';
      wrap.innerHTML = '<div class="e-emoji">🔎</div><p>Escribe una palabra clave arriba para buscar entre los productos publicados.</p>';
      grid.replaceWith(wrap);
      wrap.id = 'grid';
      return;
    }

    if (!list.length){
      var msg = view.mode === 'buscar'
        ? 'No encontramos nada con esas palabras. Prueba con otro término.'
        : 'Todavía no hay productos en esta categoría. ¡Sé la primera persona en publicar uno!';
      var emptyEl = document.createElement('div');
      emptyEl.className = 'empty-state';
      emptyEl.innerHTML = '<div class="e-emoji">🗃️</div><p>' + msg + '</p>';
      var current = document.getElementById('grid');
      current.replaceWith(emptyEl);
      emptyEl.id = 'grid';
      return;
    }

    var html = list.map(function(p){
      return '<button class="card" data-id="' + p.id + '" type="button">' +
        cardMediaHTML(p) +
        '<div class="price-badge" style="position:relative;top:-30px;margin:0 0 -22px 8px;">' + formatCLP(p.price) + '</div>' +
        '<div class="card-body">' +
          '<p class="card-title">' + escapeHTML(p.title) + '</p>' +
          '<p class="card-meta">' + catInfo(p.category).label + ' · ' + escapeHTML(p.seller.curso) + '</p>' +
        '</div>' +
      '</button>';
    }).join('');

    var current = document.getElementById('grid');
    var fresh = document.createElement('div');
    fresh.className = 'grid';
    fresh.id = 'grid';
    fresh.innerHTML = html;
    current.replaceWith(fresh);

    fresh.querySelectorAll('.card').forEach(function(btn){
      btn.addEventListener('click', function(){ openDetail(btn.getAttribute('data-id')); });
    });
  }

  function escapeHTML(str){
    var d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }

  /* corrige el badge de precio para que quede sobre la imagen, no debajo */
  function cardMediaHTMLFixed(p){
    var media = p.photo
      ? '<div class="card-media" style="background-image:url(\'' + p.photo + '\')">'
      : '<div class="card-media"><span class="emoji">' + catInfo(p.category).icon + '</span>';
    return media + '<div class="price-badge">' + formatCLP(p.price) + '</div></div>';
  }

  /* Sobrescribe renderGrid usando el layout correcto del precio sobre la imagen */
  function renderGridFinal(){
    document.getElementById('gridLabel').textContent = gridLabelText();
    var gridEl = document.getElementById('grid');

    if (view.mode === 'buscar' && !view.query.trim()){
      var emptySearch = document.createElement('div');
      emptySearch.className = 'empty-state';
      emptySearch.id = 'grid';
      emptySearch.innerHTML = '<div class="e-emoji">🔎</div><p>Escribe una palabra clave arriba para buscar entre los productos publicados.</p>';
      gridEl.replaceWith(emptySearch);
      return;
    }

    var list = currentProducts();

    if (!list.length){
      var msg = view.mode === 'buscar'
        ? 'No encontramos nada con esas palabras. Prueba con otro término.'
        : 'Todavía no hay productos en esta categoría. ¡Sé la primera persona en publicar uno!';
      var emptyEl = document.createElement('div');
      emptyEl.className = 'empty-state';
      emptyEl.id = 'grid';
      emptyEl.innerHTML = '<div class="e-emoji">🗃️</div><p>' + msg + '</p>';
      gridEl.replaceWith(emptyEl);
      return;
    }

    var html = list.map(function(p){
      return '<button class="card" data-id="' + p.id + '" type="button">' +
        cardMediaHTMLFixed(p) +
        '<div class="card-body">' +
          '<p class="card-title">' + escapeHTML(p.title) + '</p>' +
          '<p class="card-meta">' + catInfo(p.category).label + ' · ' + escapeHTML(p.seller.curso) + '</p>' +
        '</div>' +
      '</button>';
    }).join('');

    var fresh = document.createElement('div');
    fresh.className = 'grid';
    fresh.id = 'grid';
    fresh.innerHTML = html;
    gridEl.replaceWith(fresh);

    fresh.querySelectorAll('.card').forEach(function(btn){
      btn.addEventListener('click', function(){ openDetail(btn.getAttribute('data-id')); });
    });
  }

  /* ============ DETALLE DE PRODUCTO ============ */
  function openDetail(id){
    var p = state.products.find(function(x){ return x.id === id; });
    if (!p) return;

    state.catClicks[p.category] = (state.catClicks[p.category]||0) + 1;
    saveState();

    var media = p.photo
      ? '<div class="detail-media" style="background-image:url(\'' + p.photo + '\')"></div>'
      : '<div class="detail-media"><span class="emoji">' + catInfo(p.category).icon + '</span></div>';

    var inCart = state.cart.indexOf(p.id) !== -1;

    var html = media +
      '<p class="detail-price">' + formatCLP(p.price) + '</p>' +
      '<p class="detail-title">' + escapeHTML(p.title) + '</p>' +
      '<p class="detail-desc">' + escapeHTML(p.desc) + '</p>' +
      '<div class="seller-box">' +
        '<div class="seller-avatar">' + initials(p.seller.name) + '</div>' +
        '<div>' +
          '<p class="s-name">' + escapeHTML(p.seller.name) + ' · ' + escapeHTML(p.seller.curso) + '</p>' +
          '<p class="s-meta">' + escapeHTML(p.seller.contacto) + '</p>' +
        '</div>' +
      '</div>' +
      '<p class="hint" style="margin:-8px 0 14px;">' + relativeDate(p.createdAt) + ' · ' + catInfo(p.category).label + '</p>' +
      '<div class="detail-actions">' +
        '<button class="btn ' + (inCart ? 'btn-ghost' : 'btn-primary') + '" id="btnToggleCart">' + (inCart ? 'Quitar del carrito' : 'Guardar en el carrito') + '</button>' +
      '</div>';

    document.getElementById('detailContent').innerHTML = html;
    document.getElementById('btnToggleCart').addEventListener('click', function(){
      toggleCart(p.id);
      openDetail(p.id);
    });

    openSheet('sheetDetail');
  }

  /* ============ CARRITO ============ */
  function toggleCart(id){
    var idx = state.cart.indexOf(id);
    if (idx === -1){ state.cart.push(id); showToast('Guardado en tu carrito'); }
    else { state.cart.splice(idx,1); showToast('Quitado del carrito'); }
    saveState();
    renderCartBadge();
  }

  function renderCart(){
    var wrap = document.getElementById('cartContent');
    var items = state.cart.map(function(id){ return state.products.find(function(p){ return p.id===id; }); }).filter(Boolean);

    if (!items.length){
      wrap.innerHTML = '<div class="empty-state" style="padding:24px 8px;"><div class="e-emoji">🧺</div><p>Tu carrito está vacío. Explora el mercado y guarda lo que te interese.</p></div>';
      return;
    }

    var total = items.reduce(function(sum,p){ return sum + p.price; }, 0);

    var html = items.map(function(p){
      var media = p.photo
        ? 'style="background-image:url(\'' + p.photo + '\')"'
        : '';
      var emoji = p.photo ? '' : catInfo(p.category).icon;
      return '<div class="cart-item">' +
        '<div class="ci-media" ' + media + '>' + emoji + '</div>' +
        '<div class="ci-info">' +
          '<p class="ci-title">' + escapeHTML(p.title) + '</p>' +
          '<p class="ci-price">' + formatCLP(p.price) + '</p>' +
        '</div>' +
        '<button class="ci-remove" data-id="' + p.id + '" aria-label="Quitar">✕</button>' +
      '</div>';
    }).join('');

    html += '<div class="cart-total"><span>Total</span><span>' + formatCLP(total) + '</span></div>';
    html += '<button class="btn btn-primary" id="btnContactSellers" type="button">Ver contactos de vendedores</button>';

    wrap.innerHTML = html;

    wrap.querySelectorAll('.ci-remove').forEach(function(btn){
      btn.addEventListener('click', function(){
        toggleCart(btn.getAttribute('data-id'));
        renderCart();
      });
    });

    document.getElementById('btnContactSellers').addEventListener('click', function(){
      var lines = items.map(function(p){ return p.seller.name + ' (' + catInfo(p.category).label + '): ' + p.seller.contacto; });
      alert('Contacta a los vendedores:\n\n' + lines.join('\n'));
    });
  }

  /* ============ PUBLICAR PRODUCTO ============ */
  function fillCategorySelect(){
    var sel = document.getElementById('pCategoria');
    sel.innerHTML = CATEGORIES.map(function(c){ return '<option value="' + c.id + '">' + c.icon + ' ' + c.label + '</option>'; }).join('');
  }

  var pendingPhoto = null;

  function resizeImage(file, maxW, cb){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var scale = Math.min(1, maxW / img.width);
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        cb(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = function(){ cb(null); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ cb(null); };
    reader.readAsDataURL(file);
  }

  document.getElementById('pFoto').addEventListener('change', function(e){
    var file = e.target.files[0];
    if (!file) return;
    resizeImage(file, 480, function(dataUrl){
      pendingPhoto = dataUrl;
      var prev = document.getElementById('pFotoPreview');
      if (dataUrl){
        prev.style.backgroundImage = "url('" + dataUrl + "')";
        prev.style.backgroundSize = 'cover';
        prev.style.backgroundPosition = 'center';
        prev.textContent = '';
      }
    });
  });

  document.getElementById('publishForm').addEventListener('submit', function(e){
    e.preventDefault();
    var product = {
      id: 'p-' + Date.now(),
      title: document.getElementById('pTitulo').value.trim(),
      price: Number(document.getElementById('pPrecio').value) || 0,
      category: document.getElementById('pCategoria').value,
      desc: document.getElementById('pDescripcion').value.trim(),
      seller: {
        name: document.getElementById('pNombre').value.trim(),
        curso: document.getElementById('pCurso').value.trim(),
        contacto: document.getElementById('pContacto').value.trim()
      },
      photo: pendingPhoto,
      createdAt: Date.now()
    };
    state.products.unshift(product);
    saveState();

    this.reset();
    pendingPhoto = null;
    var prev = document.getElementById('pFotoPreview');
    prev.style.backgroundImage = '';
    prev.textContent = '🖼️';

    closeOverlay();
    view.mode = 'paraTi'; view.category = null; view.query = '';
    setActiveTab('paraTi');
    renderAll();
    showToast('¡Producto publicado! Ya aparece en el mercado.');
  });

  /* ============ PERFIL ============ */
  function renderProfileSheet(){
    document.getElementById('profileAvatarBig').textContent = initials(state.profile.name);
    document.getElementById('profileHeadName').textContent = state.profile.name || 'Sin nombre';
    document.getElementById('profileHeadCurso').textContent = state.profile.curso || 'Sin curso asignado';
    document.getElementById('balanceAmount').textContent = formatCLP(state.profile.saldo || 0);
    document.getElementById('prNombre').value = state.profile.name || '';
    document.getElementById('prCurso').value = state.profile.curso || '';
    document.getElementById('prCorreo').value = state.profile.correo || '';
    document.getElementById('prTelefono').value = state.profile.telefono || '';
  }

  document.getElementById('profileForm').addEventListener('submit', function(e){
    e.preventDefault();
    state.profile.name = document.getElementById('prNombre').value.trim();
    state.profile.curso = document.getElementById('prCurso').value.trim();
    state.profile.correo = document.getElementById('prCorreo').value.trim();
    state.profile.telefono = document.getElementById('prTelefono').value.trim();
    saveState();
    renderProfileButton();
    renderProfileSheet();
    showToast('Perfil actualizado');
  });

  document.getElementById('btnAddBalance').addEventListener('click', function(){
    state.profile.saldo = (state.profile.saldo || 0) + 5000;
    saveState();
    renderProfileSheet();
    showToast('Saldo simulado agregado');
  });

  /* ============ NAVEGACIÓN / TABS ============ */
  document.querySelectorAll('.tab').forEach(function(tab){
    tab.addEventListener('click', function(){
      var mode = tab.getAttribute('data-view');

      if (mode === 'carrito'){
        renderCart();
        openSheet('sheetCart');
        return;
      }

      view.mode = mode;
      setActiveTab(mode);

      document.getElementById('catPanel').hidden = mode !== 'categorias';
      document.getElementById('searchPanel').hidden = mode !== 'buscar';
      if (mode === 'buscar'){ document.getElementById('searchInput').focus(); }

      renderAll();
    });
  });

  document.getElementById('searchInput').addEventListener('input', function(e){
    view.query = e.target.value;
    renderGridFinal();
  });
  document.getElementById('btnClearSearch').addEventListener('click', function(){
    view.query = '';
    document.getElementById('searchInput').value = '';
    renderGridFinal();
  });

  /* ============ OVERLAY / SHEETS ============ */
  function openSheet(sheetId){
    document.querySelectorAll('.sheet').forEach(function(s){ s.hidden = (s.id !== sheetId); });
    document.getElementById('overlay').classList.add('open');
    document.body.classList.add('modal-open');
  }
  function closeOverlay(){
    document.getElementById('overlay').classList.remove('open');
    document.body.classList.remove('modal-open');
  }
  document.getElementById('overlay').addEventListener('click', function(e){
    if (e.target === this) closeOverlay();
  });
  document.querySelectorAll('[data-close]').forEach(function(b){
    b.addEventListener('click', closeOverlay);
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') closeOverlay();
  });

  document.getElementById('btnPublish').addEventListener('click', function(){
    openSheet('sheetPublish');
  });
  document.getElementById('btnProfile').addEventListener('click', function(){
    renderProfileSheet();
    openSheet('sheetProfile');
  });

  /* ============ RENDER GENERAL ============ */
  function renderAll(){
    renderCatPanel();
    renderFilterChip();
    renderGridFinal();
    renderCartBadge();
  }

  /* ============ INICIO ============ */
  fillCategorySelect();
  renderProfileButton();
  renderAll();

})();
</script>
</body>
</html>
